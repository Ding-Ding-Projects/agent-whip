name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2022
    outputs:
      has_output: ${{ steps.check.outputs.has_output }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for site workspace
        id: sitecheck
        shell: bash
        run: |
          if [ -d "site" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No site/ directory in this checkout yet — nothing for Pages to build. Skipping the site build step." >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: ${{ steps.sitecheck.outputs.present == 'true' }}
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ steps.sitecheck.outputs.present == 'true' }}
        run: npm ci --no-audit --no-fund

      # site/ is plain static HTML with no package.json, so there is no workspace to build.
      # `npm run build --workspace site --if-present` failed outright here: --if-present guards
      # a missing SCRIPT, not a missing WORKSPACE. Only build if the site ever grows its own
      # package.json.
      - name: Build site (only if it has its own package.json)
        if: ${{ steps.sitecheck.outputs.present == 'true' }}
        shell: bash
        run: |
          if [ -f site/package.json ]; then
            npm run build --workspace site --if-present
          else
            echo "site/ has no package.json - plain static HTML, nothing to build."
          fi

      # Structural checks. Reported, never gating, matching how ci.yml treats the test suite.
      - name: Check site structure
        if: ${{ steps.sitecheck.outputs.present == 'true' }}
        continue-on-error: true
        run: node site/check-site.mjs

      - name: Check site output exists
        id: check
        shell: bash
        run: |
          if [ "${{ steps.sitecheck.outputs.present }}" != "true" ]; then
            echo "has_output=false" >> "$GITHUB_OUTPUT"
          elif [ -d "site/dist" ]; then
            echo "output_dir=site/dist" >> "$GITHUB_ENV"
            echo "has_output=true" >> "$GITHUB_OUTPUT"
          elif [ -d "site/out" ]; then
            echo "output_dir=site/out" >> "$GITHUB_ENV"
            echo "has_output=true" >> "$GITHUB_OUTPUT"
          elif [ -f "site/index.html" ]; then
            # Plain static site: publish site/ itself. This is the normal case for this repo.
            echo "output_dir=site" >> "$GITHUB_ENV"
            echo "has_output=true" >> "$GITHUB_OUTPUT"
          else
            echo "No site/dist, site/out, or site/index.html - skipping Pages upload." >&2
            echo "has_output=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.check.outputs.has_output == 'true' }}
        with:
          path: ${{ env.output_dir }}

  deploy:
    needs: build
    if: ${{ needs.build.outputs.has_output == 'true' }}
    runs-on: windows-2022
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
