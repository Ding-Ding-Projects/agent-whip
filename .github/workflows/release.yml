name: Release

# A release fires on a pushed v* tag, or by hand. It deliberately does NOT fire on every
# push: that minted a new "Latest" for workflow-only commits — three appeared inside half an
# hour, each a ~147 MB Windows build — so "there is a new Latest" stopped meaning "somebody
# cut a release", which is the one thing a Releases page is meant to tell a visitor.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (leave blank to derive one from package.json and the run number)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-2022
    outputs:
      started_at: ${{ steps.timing.outputs.started_at }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tagcheck.outputs.exists }}
    steps:
      - name: Record start time
        id: timing
        shell: bash
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and unique tag
        id: version
        shell: bash
        run: |
          base_version=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.1.0")
          # A tag push is the normal path: publish exactly the tag that was pushed, so the
          # release and the tag a human created cannot disagree. A manual dispatch may name a
          # tag; if it does not, derive a unique one so a dispatch can never collide.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            short_sha=$(git rev-parse --short HEAD)
            tag="v${base_version}-${{ github.run_number }}-${short_sha}"
          fi
          echo "Publishing tag: ${tag}"
          echo "version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check whether this tag already has a release
        id: tagcheck
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version" 2>/dev/null || echo "0.1.0")"
          tag="v${version}-${{ github.run_number }}-$(git rev-parse --short HEAD)"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "A release for tag ${tag} already exists — nothing to publish." >&2
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.tag_exists != 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build --if-present

      # Permanent house policy: code signing is never performed here. Every
      # installer this workflow produces is, and will always be, unsigned.
      # This is the same packaging path build-installer.bat uses locally:
      # electron-builder with the Squirrel.Windows target from the committed
      # electron-builder.yml. It writes under dist/installer/squirrel-windows
      # (directories.output: dist/installer, plus the squirrel subfolder),
      # NOT the dist/ root, which is raw compiled JS/HTML/CSS and not
      # installable by anyone.
      - name: Package unsigned Squirrel.Windows installer
        run: npx electron-builder --win squirrel --config electron-builder.yml

      - name: Verify a real Setup.exe was produced
        shell: bash
        run: |
          set -u
          setup_dir="dist/installer/squirrel-windows"
          shopt -s nullglob
          setups=("${setup_dir}"/*Setup*.exe)
          if [ ${#setups[@]} -eq 0 ]; then
            echo "No *Setup*.exe found under ${setup_dir} -- electron-builder did not" >&2
            echo "produce an installer. Refusing to continue; publishing whatever" >&2
            echo "happens to be lying around in dist/ is worse than failing here." >&2
            ls -la "${setup_dir}" 2>&1 >&2 || true
            exit 1
          fi
          size=$(stat -c%s "${setups[0]}" 2>/dev/null || stat -f%z "${setups[0]}")
          if [ "${size}" -lt 1000000 ]; then
            echo "${setups[0]} is only ${size} bytes -- too small to be a real" >&2
            echo "Electron installer." >&2
            exit 1
          fi
          echo "Verified installer: ${setups[0]} (${size} bytes)"

      - name: Generate SHA256SUMS.txt
        working-directory: dist/installer/squirrel-windows
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          files=(*Setup*.exe RELEASES *.nupkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer artifacts found to hash." >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Collect installer artifacts only
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ needs.prepare.outputs.tag }}
          path: |
            dist/installer/squirrel-windows/*Setup*.exe
            dist/installer/squirrel-windows/RELEASES
            dist/installer/squirrel-windows/*.nupkg
            dist/installer/squirrel-windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.tag_exists != 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ needs.prepare.outputs.tag }}
          path: release-out

      - name: Record completion time and duration
        id: timing
        shell: bash
        run: |
          started_at="${{ needs.prepare.outputs.started_at }}"
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start_s=$(date -u -d "${started_at}" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "${started_at}" +%s)
          end_s=$(date -u -d "${completed_at}" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "${completed_at}" +%s)
          diff=$(( end_s - start_s ))
          printf -v duration '%02d:%02d:%02d' $((diff/3600)) $(((diff%3600)/60)) $((diff%60))
          echo "completed_at=${completed_at}" >> "$GITHUB_OUTPUT"
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -u
          tag="${{ needs.prepare.outputs.tag }}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "A release for ${tag} already exists (published concurrently or by hand) — skipping publish, not failing." >&2
            exit 0
          fi

          notes_file=$(mktemp)
          {
            echo "## agent-whip ${tag}"
            echo
            echo "> [!WARNING]"
            echo "> This installer is **unsigned**. Code signing is permanently out of"
            echo "> scope for this project. Windows SmartScreen will show an"
            echo "> unknown-publisher warning — this is expected, not a sign of"
            echo "> tampering. Verify the release commit and asset hashes below if in"
            echo "> doubt."
            echo
            echo "- Workflow started: ${{ needs.prepare.outputs.started_at }}"
            echo "- Workflow completed: ${{ steps.timing.outputs.completed_at }}"
            echo "- Workflow duration: ${{ steps.timing.outputs.duration }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "Checks run: build, typecheck, guard scripts (check:no-network,"
            echo "check:no-payload-logging, check:public-hygiene,"
            echo "check:reserved-terms, check:documented-commands). Test suite"
            echo "results are reported in CI but do not gate this release (see"
            echo "ci.yml)."
          } > "${notes_file}"

          # Collect only real files -- globstar (**) needs `shopt -s globstar`
          # to recurse at all, and even then a glob happily matches
          # directories, which `gh release create` cannot upload as an asset.
          shopt -s globstar nullglob
          candidates=(release-out/**/*)

          # gh release create names each asset by its basename, so two files
          # sharing a name in different subdirectories collide with an HTTP
          # 422 on upload. Stage a flat directory of uniquely-named copies.
          stage_dir=$(mktemp -d)
          asset_count=0
          setup_found=0
          for f in "${candidates[@]}"; do
            if [ -f "$f" ]; then
              rel="${f#release-out/}"
              flat_name=$(printf '%s' "${rel}" | tr '/' '__')
              cp "$f" "${stage_dir}/${flat_name}"
              asset_count=$((asset_count + 1))
              case "${flat_name}" in
                *Setup*.exe) setup_found=1 ;;
              esac
            fi
          done

          if [ "${asset_count}" -eq 0 ]; then
            echo "No built release files found under release-out/ -- refusing to" >&2
            echo "publish an assetless release. This is a build/packaging problem," >&2
            echo "not something to paper over by shipping a release with nothing" >&2
            echo "attached." >&2
            exit 1
          fi

          if [ "${setup_found}" -ne 1 ]; then
            echo "No *Setup*.exe among the collected assets -- refusing to publish" >&2
            echo "a release with no installer in it. A release without an installer" >&2
            echo "looks shipped and is not; that is worse than a failed run." >&2
            ls -la "${stage_dir}" >&2
            exit 1
          fi

          assets=("${stage_dir}"/*)

          gh release create "${tag}" \
            --title "agent-whip ${tag}" \
            --notes-file "${notes_file}" \
            "${assets[@]}"
